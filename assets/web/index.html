<!DOCTYPE html>
<!--
  Render surface for the Markdown Explorer preview handler.

  This page is served from the virtual host https://assets.mdpreview.invalid/,
  mapped by the host process to <install dir>\assets\web. The previewed
  document's own directory is mapped to https://doc.mdpreview.invalid/ so that
  relative image references resolve without granting file:// access.

  Everything is local. connect-src is 'none' — a previewed Markdown file must
  never be able to phone home, because the user only clicked a file in Explorer.

  img-src permits https: broadly, but that is NOT the enforcement point for
  remote images: the host intercepts every image request (WebResourceRequested)
  and refuses http(s) hosts unless the user opted in via AllowRemoteImages.
  CSP here is the backstop for scheme abuse; the host is the privacy gate.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src   'none';
    script-src    https://assets.mdpreview.invalid;
    style-src     https://assets.mdpreview.invalid 'unsafe-inline';
    img-src       https: data: blob:;
    font-src      https://assets.mdpreview.invalid data:;
    connect-src   'none';
    frame-src     'none';
    object-src    'none';
    base-uri      'none';
    form-action   'none';
  " />
  <meta name="referrer" content="no-referrer" />
  <title>Markdown Preview</title>

  <!--
    Themes are toggled with media="not all" rather than the `disabled` attribute:
    media is unambiguously spec'd, applies before first paint, and avoids the
    flash-of-wrong-theme you get when disabling stylesheets from script.
  -->
  <link id="css-body-light" rel="stylesheet" href="css/github-markdown-light.css" media="all" />
  <link id="css-body-dark"  rel="stylesheet" href="css/github-markdown-dark.css"  media="not all" />
  <link id="css-code-light" rel="stylesheet" href="css/github.min.css"            media="all" />
  <link id="css-code-dark"  rel="stylesheet" href="css/github-dark.min.css"       media="not all" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/preview.css" />
</head>
<body>
  <div id="notice" class="notice" role="status" hidden></div>

  <!-- The toolbar: search, its options row, the contents toggle, and the only
       close button. Ctrl+F or the context menu shows it; the document always
       starts below it (preview.js keeps --mdp-bar-offset equal to its height).
       The contents rail docks below it on the right and may hang over the
       document by design. -->
  <div id="toolbar" class="mdp-toolbar" hidden>
    <div class="mdp-toolbar-row">
      <input id="find-input" type="text" placeholder="Find" spellcheck="false"
             autocomplete="off" aria-label="Find in preview" />
      <span id="find-count" class="mdp-find-count"></span>
      <button id="find-prev" class="mdp-toolbar-button" type="button" title="Previous match (Shift+Enter)">▲</button>
      <button id="find-next" class="mdp-toolbar-button" type="button" title="Next match (Enter)">▼</button>
      <button id="find-options" class="mdp-toolbar-button" type="button"
              title="Search options" aria-expanded="false" aria-controls="find-opts">⚙</button>
      <span class="mdp-toolbar-divider"></span>
      <button id="toc-toggle" class="mdp-toolbar-button mdp-toc-toggle" type="button"
              aria-expanded="false">Contents <span id="toc-chevron" class="mdp-toc-chevron">▾</span></button>
      <span class="mdp-toolbar-divider"></span>
      <button id="toolbar-close" class="mdp-toolbar-button mdp-close-button" type="button"
              title="Close (Esc)">×</button>
    </div>

    <!-- Search options: a real row, so the states stay readable while set. The
         theme selector sits at its right edge; the whole toolbar spans the
         pane, so the contents rail (which starts BELOW the bar) can never
         cover it. -->
    <div id="find-opts" class="mdp-toolbar-options" hidden>
      <label><input type="checkbox" id="find-case" /> Match case</label>
      <label><input type="checkbox" id="find-word" /> Match whole word</label>
      <label title="Combines with the others. With whole word the pattern is wrapped as \b(?:pattern)\b, so one starting or ending with a non-word character will not match."><input type="checkbox" id="find-regex" /> Regular expression</label>
      <span class="mdp-toolbar-spacer"></span>
      <label class="mdp-theme-label">Theme
        <select id="theme-select" aria-label="Colour theme">
          <option value="system">System</option>
          <optgroup label="Light">
            <option value="paper">Paper</option>
            <option value="arctic">Arctic</option>
            <option value="ledger">Ledger</option>
          </optgroup>
          <optgroup label="Dark">
            <option value="harbor">Harbor</option>
            <option value="midnight">Midnight</option>
            <option value="carbon">Carbon</option>
          </optgroup>
        </select>
      </label>
    </div>
  </div>

  <!-- Contents rail: docked under the toolbar along the right edge, populated
       per render. Toggled from the toolbar; no close button of its own. -->
  <aside id="toc" class="mdp-toc" hidden>
    <nav id="toc-list" class="mdp-toc-list"></nav>
  </aside>

  <article id="content" class="markdown-body"></article>

  <!-- Always-on core: ~360 KB total. Mermaid (3.5 MB) and MathJax (2.1 MB) are
       injected on demand by preview.js only when the document needs them. -->
  <script src="js/markdown-it.min.js"></script>
  <script src="js/markdownItAnchor.umd.js"></script>
  <script src="js/highlight.min.js"></script>
  <script src="js/preview.js"></script>
</body>
</html>
